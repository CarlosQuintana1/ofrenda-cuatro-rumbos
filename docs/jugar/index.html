<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jugar, Ofrenda de los Cuatro Rumbos</title>
<meta name="theme-color" content="#0d0912">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--fondo:#0d0912;--tinta:#f3ead8;--suave:#a99fb3;--cempa:#f08a1d;--fin:cubic-bezier(.22,.8,.24,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;background:var(--fondo);color:var(--tinta);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
body::before{content:"";position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse 80% 70% at 50% 60%,rgba(13,9,18,.35),rgba(13,9,18,.92))}
main{position:relative;z-index:2;min-height:100svh;display:grid;place-items:center;text-align:center;padding:32px 16px}
.punto{width:12px;height:12px;border-radius:50%;background:var(--cempa);margin:0 auto 28px;box-shadow:0 0 0 0 rgba(240,138,29,.6);animation:late 2.4s var(--fin) infinite}
@keyframes late{70%{box-shadow:0 0 0 22px rgba(240,138,29,0)}100%{box-shadow:0 0 0 0 rgba(240,138,29,0)}}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;letter-spacing:-.035em;line-height:1;font-size:clamp(2.4rem,7vw,4.6rem);max-width:14ch;margin:0 auto 20px}
p{color:var(--suave);font-size:1.08rem;line-height:1.6;max-width:44ch;margin:0 auto 34px}
.botones{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;gap:10px;font-weight:500;padding:13px 22px;border-radius:999px;text-decoration:none;color:var(--tinta);border:1px solid rgba(243,234,216,.28);transition:transform .4s var(--fin),background .3s}
a:hover{transform:translateY(-2px);background:rgba(243,234,216,.08)}
a.lleno{background:var(--tinta);color:#120c16;border-color:var(--tinta)}
a.lleno:hover{background:#fff}
@media (prefers-reduced-motion:reduce){.punto{animation:none}video{display:none}}
</style>
</head>
<body>
<video autoplay muted loop playsinline poster="../media/bucles/noche.jpg" src="../media/bucles/noche.mp4"></video>
<main>
  <div>
    <div class="punto"></div>
    <h1>La versión web está en camino</h1>
    <p>Muy pronto vas a poder recorrer la ofrenda desde aquí, sin instalar nada. Mientras tanto, mírala en video o ponla sobre tu mesa con el celular.</p>
    <div class="botones">
      <a class="lleno" href="../#video">Ver el recorrido</a>
      <a href="../ar/">Realidad aumentada</a>
      <a href="../">Volver</a>
    </div>
  </div>
</main>
</body>
</html>
