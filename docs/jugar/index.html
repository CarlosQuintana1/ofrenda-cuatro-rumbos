<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jugar, Ofrenda de los Cuatro Rumbos</title>
<style>
:root{--noche:#140B20;--hueso:#F3E9D2;--tenue:#BFB3CF;--cempasuchil:#F08A1D}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--noche) url(../media/galeria/atardecer.jpg) center/cover;color:var(--hueso);font-family:system-ui,-apple-system,sans-serif;padding:16px}
.caja{max-width:460px;text-align:center;background:rgba(20,11,32,.88);border-radius:18px;padding:40px 30px}
h1{font-size:1.7rem;margin-bottom:12px}
p{color:var(--tenue);line-height:1.6;margin-bottom:24px}
a{display:inline-block;background:var(--cempasuchil);color:#1B1B1B;font-weight:600;text-decoration:none;padding:12px 22px;border-radius:12px}
</style>
</head>
<body>
<div class="caja">
  <h1>La versión web viene en camino</h1>
  <p>Estoy preparando la ofrenda para que se pueda recorrer desde el navegador. Mientras tanto puedes descargarla para Windows o Mac, o verla en realidad aumentada con tu celular.</p>
  <a href="../">Volver a la página</a>
</div>
</body>
</html>
